name: New Movie Trailer Shorts

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  build-short:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install feedparser google-genai Pillow

      - name: Build the latest Short
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/build_short.py

      - name: Save trailer tracking
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seen.json || true
          git diff --cached --quiet || git commit -m "Update trailer tracking"
          git push || true

      - name: Upload finished Short for approval
        uses: actions/upload-artifact@v4
        with:
          name: movie-trailer-short
          path: output/
          if-no-files-found: warn
